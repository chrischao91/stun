
name: Build Windows NAT Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - name: Build Windows executable
        run: |
          go build -trimpath -ldflags="-s -w" -o stun-nat-behaviour.exe ./cmd/stun-nat-behaviour

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: stun-nat-behaviour-windows-amd64
          path: stun-nat-behaviour.exe
